<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js 3D Model with Animation</title>
    
    <!-- นำเข้า A-Frame Library -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <!-- นำเข้า AR.js สำหรับ A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <!-- นำเข้า aframe-extras เพื่อเล่น Animation จากไฟล์ GLTF/GLB -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- โหลด Asset 3D Model -->
        <a-assets>
            <a-asset-item id="epona-model" src="https://sibsansuk.github.io/epona.glb"></a-asset-item>
        </a-assets>

        <!-- กำหนด Marker ที่ใช้งาน -->
        <!-- หมายเหตุ: ตัวอย่างนี้ใช้ type="pattern" สำหรับกำหนด Custom Marker Image -->
        <a-marker type="pattern" url="https://aitutorialcourse.github.io/tracker.patt">
            
            <!-- แสดงผล 3D Model พร้อมเล่น Animation -->
            <!-- animation-mixer คือตัวสั่งให้เล่น animation ในไฟล์ glb -->
            <a-entity 
                gltf-model="#epona-model" 
                scale="0.5 0.5 0.5" 
                position="0 0 0" 
                rotation="0 0 0"
                animation-mixer>
            </a-entity>

        </a-marker>

        <!-- คาเมร่าสำหรับ AR -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
